<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link device</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:#0e1116;color:#e8eaed;
min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 20px}
h1{font-size:21px;margin:0 0 8px;letter-spacing:-.02em;text-align:center}
p{color:#9aa0a6;font-size:13.5px;line-height:1.55;margin:0 0 18px;text-align:center;max-width:300px}
.card{background:#fff;padding:14px;border-radius:14px}
img{display:block;width:250px;height:250px}
a.btn{display:block;width:100%;max-width:330px;text-align:center;background:#3a76f0;color:#fff;
text-decoration:none;padding:16px;border-radius:12px;font-weight:600;font-size:15px;margin:18px 0 10px}
button{background:none;border:1px solid #2c3138;color:#9aa0a6;padding:11px 18px;border-radius:10px;
font-size:13.5px;font-family:inherit;width:100%;max-width:330px}
.ok{color:#5bd68a;font-weight:600;text-align:center}
.bad{color:#f28b82;text-align:center;font-size:13.5px}
ul{list-style:none;padding:0;margin:16px 0 0;width:100%;max-width:330px}
li{border-bottom:1px solid #1e2329;padding:10px 2px;font-size:14px}
li small{display:block;color:#9aa0a6;font-size:12.5px}
pre{font-size:10.5px;color:#5f6368;word-break:break-all;white-space:pre-wrap;max-width:330px;margin-top:14px}
</style></head><body>
<h1>Link this phone</h1>
<p id="msg">Starting…</p>
<div id="box"></div>
<script>
var box = document.getElementById('box'), msg = document.getElementById('msg'), sid = null, t = null;

async function start() {
  box.innerHTML = ''; msg.className = ''; msg.textContent = 'Starting…';
  var r = await fetch('/start');
  sid = (await r.json()).sid;
  t = setInterval(poll, 900);
}

async function poll() {
  var s = await (await fetch('/state/' + sid)).json();

  if (s.state === 'ready' && !box.dataset.qr) {
    box.dataset.qr = '1';
    msg.textContent = 'Open Signal, then tap the button below.';
    var a = document.createElement('a');
    a.className = 'btn'; a.href = s.uri; a.textContent = 'Open Signal and link';
    box.appendChild(a);
    var d = document.createElement('div');
    d.className = 'card';
    var img = document.createElement('img');
    img.src = s.qr; img.alt = 'QR';
    d.appendChild(img);
    box.appendChild(d);
    var p2 = document.createElement('p');
    p2.textContent = 'Or scan it from Signal › Settings › Linked devices.';
    box.appendChild(p2);
    var b = document.createElement('button');
    b.textContent = 'New code';
    b.onclick = async function () {
      clearInterval(t);
      box.dataset.qr = '';
      await fetch('/retry/' + sid);
      t = setInterval(poll, 900);
      msg.textContent = 'Refreshing…';
    };
    box.appendChild(b);
    var pre = document.createElement('pre');
    pre.textContent = s.uri;
    box.appendChild(pre);
  }

  if (s.state === 'done') {
    clearInterval(t);
    msg.className = 'ok';
    msg.textContent = 'Linked. ' + s.contacts.length + ' contacts.';
    var ul = document.createElement('ul');
    s.contacts.slice(0, 40).forEach(function (c) {
      var li = document.createElement('li');
      li.textContent = c.name || '(no name)';
      var sm = document.createElement('small');
      sm.textContent = c.number || '';
      li.appendChild(sm);
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  if (s.state === 'failed' || s.state === 'error') {
    clearInterval(t);
    msg.className = 'bad';
    msg.textContent = 'Failed: ' + (s.error || 'unknown');
  }
}

start();
</script></body></html>
